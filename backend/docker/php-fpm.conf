; PHP-FPM de producción (SERVIDOR=fpm, ver docker-entrypoint.sh): varios procesos que
; atienden en paralelo. Una consulta lenta ya no hace esperar al resto del mesón, y si
; un proceso se queda sin memoria muere solo ese, no la API completa.
[www]
pm = dynamic
; Cada proceso atiende una petición a la vez. 16 alcanzan para el mesón, el portal y
; los reportes juntos; subirlo si el servidor tiene RAM de sobra (~60 MB por proceso).
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Se reciclan cada tanto, por si alguna extensión pierde memoria.
pm.max_requests = 500
request_terminate_timeout = 120s

; Las variables del contenedor (DB_HOST, APP_ENV...) tienen que llegar a Laravel.
clear_env = no

; Los errores de PHP salen en los logs del contenedor (docker compose logs backend).
catch_workers_output = yes
decorate_workers_output = no
