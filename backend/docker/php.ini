; Ajustes de PHP para la imagen del backend (CLI y PHP-FPM).

; Tope por petición. Los listados van por páginas, así que una petición normal usa
; 20–60 MB; el margen es para los reportes de un año completo y la carga masiva.
memory_limit = 256M
post_max_size = 20M
upload_max_filesize = 20M
expose_php = Off

; OPcache: PHP-FPM guarda el código ya compilado en memoria. El código va horneado
; en la imagen (no cambia mientras corre), así que no hace falta revisar los archivos.
; En la línea de comandos (artisan, artisan serve en desarrollo) queda apagado.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
