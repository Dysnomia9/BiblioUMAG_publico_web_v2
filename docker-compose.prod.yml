# Compose de referencia para producción — a diferencia de docker-compose.yml
# (desarrollo): sin bind mounts, sin credenciales hardcodeadas (vienen del
# entorno del host/CI), sin exponer el puerto de MySQL al host. No es
# "listo para usar tal cual" — reemplazar los ${VAR} desde el gestor de
# secretos del entorno de despliegue real antes de levantar.
#
# Uso: docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # Misma collation que en desarrollo: de ella dependen las búsquedas sin tildes.
    # Si Informática entrega un servidor MySQL propio, este servicio sobra; la base
    # de allá tiene que crearse con CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_mysql_data:/var/lib/mysql
    # Sin "ports:" a propósito — solo backend accede a MySQL, dentro de la
    # red interna de compose. No publicar 3306 al host.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Sin pool de conexiones delante: PHP-FPM abre una conexión por request, y MySQL
  # las abre mucho más barato que PostgreSQL (un hilo por conexión, no un proceso).
  # Con el tope de procesos de backend/docker/php-fpm.conf no se llega al
  # max_connections por defecto de MySQL (151).

  # Laravel con PHP-FPM: varios procesos atendiendo en paralelo (ver
  # backend/docker/php-fpm.conf). No publica puertos: lo alcanza solo el nginx "api".
  backend:
    build:
      context: ./backend
      target: app
      # Cada construcción baja las imágenes base al día (php:8.3-fpm, nginx:1.30-alpine),
      # con sus arreglos de seguridad, en vez de reusar una copia vieja del servidor.
      pull: true
    # Con nombre propio: el servicio "scheduler" usa esta misma imagen.
    image: bibliomag-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &entorno-backend
      APP_ENV: production
      APP_DEBUG: "false"
      SERVIDOR: fpm
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Si la base es un servidor externo que exige TLS: ruta al certificado de su CA.
      MYSQL_ATTR_SSL_CA: ${MYSQL_ATTR_SSL_CA:-}
      FRONTEND_URL: ${FRONTEND_URL}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      # Notificaciones, Google y LDAP (ver backend/.env.production.example y
      # docs/login-externo-pendientes.md). Todas opcionales: si quedan vacías,
      # cada función responde "no configurado" en vez de fallar.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-biblioteca@umag.cl}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Biblioteca UMAG}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-10}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_DOMINIOS: ${GOOGLE_DOMINIOS:-}
      LDAP_HOST: ${LDAP_HOST:-}
      LDAP_PORT: ${LDAP_PORT:-389}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_USERNAME: ${LDAP_BIND_USERNAME:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_ATTRIBUTE: ${LDAP_USER_ATTRIBUTE:-}
      LDAP_EMAIL_ATTRIBUTE: ${LDAP_EMAIL_ATTRIBUTE:-}
      LDAP_TLS: ${LDAP_TLS:-false}

  # Tareas programadas de Laravel (backend/routes/console.php), como la limpieza diaria
  # de sesiones vencidas: la misma imagen y el mismo entorno del backend, con
  # `schedule:work` en vez de PHP-FPM. No publica puertos.
  scheduler:
    image: bibliomag-backend
    # La imagen la construye "backend": no hay nada que descargar de Docker Hub.
    pull_policy: never
    restart: unless-stopped
    depends_on:
      - backend
    environment: *entorno-backend
    entrypoint: ["php", "artisan", "schedule:work"]

  # La puerta de entrada de la API (puerto 8000, el mismo de siempre): nginx recibe
  # las peticiones y se las pasa a PHP-FPM del servicio "backend".
  api:
    build:
      context: ./backend
      target: nginx
      pull: true
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      # Aplicación compilada servida por nginx (ver frontend/Dockerfile), no el
      # servidor de desarrollo de Vite.
      target: produccion
      pull: true
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_mysql_data:
