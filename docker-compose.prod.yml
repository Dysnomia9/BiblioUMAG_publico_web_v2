# Compose de referencia para producción — a diferencia de docker-compose.yml
# (desarrollo): sin bind mounts, sin credenciales hardcodeadas (vienen del
# entorno del host/CI), sin exponer el puerto de Postgres al host. No es
# "listo para usar tal cual" — reemplazar los ${VAR} desde el gestor de
# secretos del entorno de despliegue real antes de levantar.
#
# Uso: docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Sin "ports:" a propósito — solo backend accede a Postgres, dentro de la
    # red interna de compose. No publicar 5432 al host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 3s
      timeout: 5s
      retries: 10

  # pgbouncer (opcional, recomendado si el tráfico lo justifica): PHP-FPM abre
  # una conexión nueva por request, sin pool delante. Si se agrega, apuntar
  # DB_HOST del backend a este servicio en vez de a "db" directamente.
  # pgbouncer:
  #   image: edoburu/pgbouncer
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}
  #   depends_on:
  #     db:
  #       condition: service_healthy

  # Laravel con PHP-FPM: varios procesos atendiendo en paralelo (ver
  # backend/docker/php-fpm.conf). No publica puertos: lo alcanza solo el nginx "api".
  backend:
    build:
      context: ./backend
      target: app
    # Con nombre propio: el servicio "scheduler" usa esta misma imagen.
    image: bibliomag-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &entorno-backend
      APP_ENV: production
      APP_DEBUG: "false"
      SERVIDOR: fpm
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: require
      FRONTEND_URL: ${FRONTEND_URL}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      # Notificaciones, Google y LDAP (ver backend/.env.production.example y
      # docs/login-externo-pendientes.md). Todas opcionales: si quedan vacías,
      # cada función responde "no configurado" en vez de fallar.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-biblioteca@umag.cl}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Biblioteca UMAG}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_DOMINIOS: ${GOOGLE_DOMINIOS:-}
      LDAP_HOST: ${LDAP_HOST:-}
      LDAP_PORT: ${LDAP_PORT:-389}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_USERNAME: ${LDAP_BIND_USERNAME:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_ATTRIBUTE: ${LDAP_USER_ATTRIBUTE:-}
      LDAP_EMAIL_ATTRIBUTE: ${LDAP_EMAIL_ATTRIBUTE:-}
      LDAP_TLS: ${LDAP_TLS:-false}

  # Tareas programadas de Laravel (backend/routes/console.php), como la limpieza diaria
  # de sesiones vencidas: la misma imagen y el mismo entorno del backend, con
  # `schedule:work` en vez de PHP-FPM. No publica puertos.
  scheduler:
    image: bibliomag-backend
    restart: unless-stopped
    depends_on:
      - backend
    environment: *entorno-backend
    entrypoint: ["php", "artisan", "schedule:work"]

  # La puerta de entrada de la API (puerto 8000, el mismo de siempre): nginx recibe
  # las peticiones y se las pasa a PHP-FPM del servicio "backend".
  api:
    build:
      context: ./backend
      target: nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      # Aplicación compilada servida por nginx (ver frontend/Dockerfile), no el
      # servidor de desarrollo de Vite.
      target: produccion
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
