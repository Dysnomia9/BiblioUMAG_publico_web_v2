# Cabeceras de protección del frontend. Se incluye en cada location de nginx.conf,
# porque un add_header dentro de un location anula todos los del server.
#
# Content-Security-Policy: solo corre el código del propio sitio (nada escrito en la
# página ni traído de otros), las fuentes vienen de Google Fonts y la API está en el
# mismo servidor, puerto 8000 (src/services/api.ts), con http o https según cómo se
# publique. Si alguien lograra meter código en una página, no podría ejecutarlo ni
# mandar datos a otro sitio.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://$host:8000 https://$host:8000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Ninguna otra página puede mostrar el sistema dentro de la suya (engaños con clics invisibles).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# La cámara, solo para escanear el QR desde el propio sitio; micrófono y ubicación, nunca.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
