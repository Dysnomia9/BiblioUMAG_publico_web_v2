server {
    listen 80;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # El router de Vue usa rutas reales (/prestamo, /portal/salas...): toda ruta
    # que no sea un archivo existente se responde con index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos de /assets llevan un hash en el nombre, así que pueden quedar
    # en caché del navegador; index.html no, para que tome cada versión nueva.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
