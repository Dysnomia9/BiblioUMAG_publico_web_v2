server {
    listen 80;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Comprimir el texto: el JavaScript principal pasa de unos 180 KB a 65 KB, y la
    # diferencia se nota sobre todo en el teléfono (el portal, con datos móviles).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # El router de Vue usa rutas reales (/prestamo, /portal/salas...): toda ruta
    # que no sea un archivo existente se responde con index.html.
    location / {
        include /etc/nginx/snippets/cabeceras.conf;
        try_files $uri $uri/ /index.html;
    }

    # Los archivos de /assets llevan un hash en el nombre, así que pueden quedar
    # en caché del navegador; index.html no, para que tome cada versión nueva.
    location /assets/ {
        include /etc/nginx/snippets/cabeceras.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/cabeceras.conf;
        add_header Cache-Control "no-cache";
    }
}
