services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # utf8mb4_unicode_ci: las búsquedas con LIKE no distinguen tildes, mayúsculas
    # ni la ñ («garcia» encuentra «García»). El sistema depende de eso.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: biblioteca
      MYSQL_USER: biblioteca
      MYSQL_PASSWORD: biblioteca
      MYSQL_ROOT_PASSWORD: raiz_local
    volumes:
      # Volumen propio de MySQL: no reutiliza el de la versión PostgreSQL (db_data),
      # que MySQL no podría leer.
      - db_mysql_data:/var/lib/mysql
      # Al crear el volumen por primera vez: la base de pruebas biblioteca_test.
      - ./backend/docker/mysql:/docker-entrypoint-initdb.d:ro
    # Solo desde este computador: el backend usa la red interna de Docker, y la
    # contraseña de desarrollo es conocida.
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      # Por TCP a propósito: mientras MySQL se inicializa por primera vez corre un
      # servidor temporal sin red, y un ping por socket lo daría por listo antes de tiempo.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u biblioteca -pbiblioteca --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
      # Cada construcción baja la imagen base al día (php:8.3-fpm), con sus arreglos de
      # seguridad, en vez de reusar una copia vieja guardada en el computador.
      pull: true
    # Con nombre propio: el servicio "scheduler" usa esta misma imagen.
    image: bibliomag-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &entorno-backend
      # Desarrollo declarado: solo con APP_ENV=local el arranque carga los datos de
      # prueba (admin@umag.cl / admin123) y crea la base de tests (docker-entrypoint.sh).
      APP_ENV: local
      # Una base nueva arranca con los datos de prueba (mockup:datos). Con
      # DATOS_DE_PRUEBA=no arranca vacía, como producción: la primera cuenta se crea
      # con php artisan sistema:iniciar (ver README, «Empezar sin datos de prueba»).
      DATOS_DE_PRUEBA: ${DATOS_DE_PRUEBA:-si}
      # Sin DB_CONNECTION a propósito: el .env de la imagen ya dice mysql, y si se
      # define acá, phpunit.xml no puede cambiarla a mysql_testing y los tests vacían
      # 'biblioteca' (ver backend/README.md).
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: biblioteca
      DB_USERNAME: biblioteca
      DB_PASSWORD: biblioteca
      FRONTEND_URL: http://localhost:5173
      SANCTUM_STATEFUL_DOMAINS: localhost:5173
    volumes:
      # Solo el reporte de auditoría de dependencias (ver docker-entrypoint.sh)
      # queda mapeado al host para revisarlo sin entrar al contenedor — el
      # resto del código sigue horneado en la imagen a propósito (ver README).
      - ./backend/storage/reports:/var/www/storage/reports
    # Solo desde este computador, como MySQL: con las cuentas de prueba y el modo
    # debug, publicarlo a la red dejaría entrar como administrador a cualquiera del
    # mismo WiFi. Para probar desde el celular, ESCUCHAR_EN=0.0.0.0 (ver README).
    ports:
      - "${ESCUCHAR_EN:-127.0.0.1}:8000:8000"

  # Tareas programadas de Laravel (backend/routes/console.php), como la limpieza diaria
  # de sesiones vencidas: la misma imagen y el mismo entorno del backend, con
  # `schedule:work` en vez del servidor. No publica puertos.
  scheduler:
    image: bibliomag-backend
    # La imagen la construye "backend": no hay nada que descargar de Docker Hub.
    pull_policy: never
    restart: unless-stopped
    depends_on:
      - backend
    environment: *entorno-backend
    entrypoint: ["php", "artisan", "schedule:work"]

  frontend:
    build:
      context: ./frontend
      pull: true
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${ESCUCHAR_EN:-127.0.0.1}:5173:5173"

volumes:
  db_mysql_data:
